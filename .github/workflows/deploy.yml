name: Deploy Menetti Diego

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: menettidiego-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail

          : "${VPS_HOST:?Missing secret VPS_HOST}"
          : "${VPS_SSH_KEY:?Missing secret VPS_SSH_KEY}"

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          ssh-keyscan -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Deploy on VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          : "${VPS_HOST:?Missing secret VPS_HOST}"
          : "${VPS_USER:?Missing secret VPS_USER}"

          ssh -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              "${VPS_USER}@${VPS_HOST}" \
              'sudo /usr/local/bin/deploy-menettidiego'
